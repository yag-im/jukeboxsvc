[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]

[project]
authors = [{ name = "acme-im" }]
description = "jukebox cluster management service"
keywords = ["signaling"]
name = "jukeboxsvc"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34.21,<2",
    "dateparser>=1.2.0,<2",
    "docker>=7.2.0,<8",
    "gunicorn>=23.0.0,<24",
    "fabric>=3.2.2,<4",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.31",
    "sqlalchemy>=2.0.0,<3",
    "psycopg[binary]>=3.2,<4",
    "ovh>=1.2.0,<2",
    "openstacksdk>=4.0,<5",
    "pydantic>=2.0,<3",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
    "types-dateparser",
    "types-requests",
]
test = [
    "pytest",
    "pytest-dotenv",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["jukeboxsvc"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["**/gen/*", "target"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "ANN", # flake8-annotations (replaces mypy disallow_untyped_defs)
    "S",   # bandit
    "PL",  # pylint
]
ignore = [
    "E501",   # line length is handled by the formatter
    "ANN401", # allow typing.Any
    "N818",   # exception names without Error suffix
    "PLR",    # pylint refactor checks were disabled
    "PLW0603", # global-statement was disabled
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["jukeboxsvc"]

[tool.pyright]
include = ["jukeboxsvc"]
exclude = ["tests", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-s -v"
env_files = [
    "tests/pytest.env",
    ".devcontainer/secrets.env"
]
markers = [
    "integration: marks integration tests",
    "unit: marks unittests"
]
testpaths = "tests"
