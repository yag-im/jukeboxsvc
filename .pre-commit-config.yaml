repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.12.21"
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        args: [ --config=lint/.gitlint, --msg-filename ]
  - repo: local
    hooks:
      # run from the project venv so the versions match uv.lock and pyright sees installed deps
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [ python, pyi ]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [ python, pyi ]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        types_or: [ python, pyi ]
        pass_filenames: false
